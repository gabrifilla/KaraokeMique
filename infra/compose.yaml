services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: karaoke_dev
      POSTGRES_USER: karaoke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - karaoke_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaoke -d karaoke_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  karaoke_pg:
