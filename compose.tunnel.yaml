# Acesso pela internet com HTTPS, sem abrir portas no roteador.
# O INICIAR usa este arquivo junto com compose.server.yaml quando ACCESS_MODE=internet.
services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Preencha CLOUDFLARE_TUNNEL_TOKEN em .env.server}
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
